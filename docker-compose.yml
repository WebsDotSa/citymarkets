services:
  citymarket-app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=01777
    volumes:
      # Bind mount for server logs (required for logging)
      - ./server.log:/app/server.log:rw
      # Bind mount for Next.js cache (host dir owned by 1001:1001)
      - ./.next-cache-host:/app/.next/cache
      # Bind mount for uploaded images (host dir owned by 1001:1001 so the
      # nextjs user inside the container can write offer/banner uploads).
      # The container is read_only — without this volume mount, the
      # /api/admin/upload route fails with EROFS (فشل رفع الملف).
      - ./public/images:/app/public/images:rw
    environment:
      PORT: "3005"
      # Non-secret overrides only — secrets come from env_file (.env.local)
      # below. Listing them here with ${VAR} (no default) would override the
      # env_file values with empty strings when the shell has them unset,
      # which is what caused JWT_SECRET to be empty inside the container.
      # DATABASE_HOST/PORT/NAME/USER intentionally NOT listed — they come
      # from env_file (.env.local) so the pooler URL / Supabase creds win.
      # (2026-08-17: previously had `${DATABASE_HOST:-127.0.0.1}` defaults
      # which masked the .env.local values after the Supabase migration.)
      # Disable Next.js telemetry
      NEXT_TELEMETRY_DISABLED: "1"
    # All secrets (JWT_SECRET, ADMIN_JWT_SECRET, VENDOR_JWT_SECRET,
    # DATABASE_URL, DATABASE_PASSWORD, Twilio keys, Moyasar keys, etc.)
    # come from here — do NOT also list them in the environment block
    # above, as that takes precedence and would mask these values.
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      # PORT (env) is 3005 above; the healthcheck MUST hit that port or
      # the container is marked unhealthy indefinitely despite the app
      # running fine. Use 127.0.0.1 (IPv4) because Next.js binds 0.0.0.0
      # only — `localhost` resolves to IPv6 [::1] and refuses the
      # connection, marking the container unhealthy even when healthy.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3005/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background worker: OTP cleanup, broadcast processing, pending-order
  # checks. Runs `tsx scripts/worker.ts` on its own schedule (1 min /
  # 5 min / hourly / daily). MUST be deployed alongside the app service,
  # otherwise broadcast delivery and OTP expiry cleanup silently never
  # run. Shares the same env_file so DATABASE_URL / JWT secrets match
  # the app.
  citymarket-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    network_mode: host
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=01777
    env_file:
      - .env.local
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    # No healthcheck — the worker is a long-lived setInterval loop. If
    # the process dies, Docker will restart it; a healthcheck would just
    # be a tautology.

  # Redis for distributed rate limiting (P1-1, security Phase 4 2026-10-03).
  # The rate-limit helper at src/lib/rate-limit.ts falls back to in-memory
  # when REDIS_URL is unset, but in-memory state is per-process so a
  # multi-instance deployment cannot share rate-limit buckets. The single-
  # instance `network_mode: host` deploy (this file's current mode) gets
  # accurate per-IP / per-phone limiting either way; the Redis service
  # below exists for the future multi-instance rollout and for the worker
  # to share the same bucket.
  #
  # Why redis:7-alpine: small footprint, official image, persistence
  # via AOF if a future operator needs it (off by default — rate-limit
  # buckets are ephemeral and re-derivable on cold start).
  #
  # Why no `network_mode: host` here: the app and worker already use
  # host networking, so they reach Redis on 127.0.0.1:6379 directly.
  # Redis listens on its default port inside its own container, which
  # host-networked services reach via the loopback address. This is the
  # simplest topology that does not require a custom bridge.
  citymarket-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    # redis:7-alpine ships with a redis user (uid 999). Run as that
    # user so the container is not running as root. The image already
    # sets USER redis; this is documented here for clarity.
    user: "999:999"
    network_mode: host
    restart: unless-stopped
    # Read-only root fs. Redis only writes to its working dir; the
    # default is /data which is also a tmpfs so writes are constrained
    # to in-memory + AOF (we disabled both above, so nothing is
    # persisted across restarts — the rate-limit buckets reset, which
    # is the intended behaviour for a "request throttling" cache).
    read_only: true
    tmpfs:
      - /data:size=50M,mode=0755,uid=999,gid=999
    healthcheck:
      # PING the local Redis. A successful PONG exits 0; a failed
      # PING exits 1 and Docker restarts the container.
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nextjs_cache:
