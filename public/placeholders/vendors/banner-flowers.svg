<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880E4F"/>
      <stop offset="50%" stop-color="#AD1457"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#F8BBD0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F8BBD0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="petals" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <g transform="translate(50 50)" opacity="0.08">
        <ellipse cx="0" cy="-12" rx="6" ry="10" fill="#F8BBD0"/>
        <ellipse cx="11" cy="-4" rx="6" ry="10" fill="#F8BBD0" transform="rotate(72)"/>
        <ellipse cx="7" cy="10" rx="6" ry="10" fill="#F8BBD0" transform="rotate(144)"/>
        <ellipse cx="-7" cy="10" rx="6" ry="10" fill="#F8BBD0" transform="rotate(216)"/>
        <ellipse cx="-11" cy="-4" rx="6" ry="10" fill="#F8BBD0" transform="rotate(288)"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#petals)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <g transform="translate(300 200)">
    <circle r="80" fill="none" stroke="#F8BBD0" stroke-width="2" opacity="0.3"/>
    <circle r="120" fill="none" stroke="#F8BBD0" stroke-width="1" opacity="0.15"/>
  </g>
  <text x="80" y="240" font-family="Tajawal, IBM Plex Sans Arabic, sans-serif" font-size="64" font-weight="900" fill="#F8BBD0" opacity="0.95">أميز للورود</text>
  <text x="80" y="290" font-family="Tajawal, sans-serif" font-size="22" font-weight="500" fill="#FCE4EC" opacity="0.7">ورود طبيعية · باقات مميزة</text>
</svg>
