  </g>
  <text x="80" y="240" font-family="Tajawal, IBM Plex Sans Arabic, sans-serif" font-size="64" font-weight="900" fill="#FFB74D" opacity="0.95">أميز كافية</text>
  <text x="80" y="290" font-family="Tajawal, sans-serif" font-size="22" font-weight="500" fill="#FFE0B2" opacity="0.7">قهوة مختصة · أجواء مميزة</text>
