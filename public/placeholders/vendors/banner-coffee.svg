<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="beans" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
