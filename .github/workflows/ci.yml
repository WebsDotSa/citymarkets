name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push lands —
# saves CI minutes when developers force-push amends.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        # pgvector/pgvector:pg16 bundles the `vector` extension required
        # by migration 001 (product embeddings + 073's event-ledger
        # gateway indexes). Plain postgres:16-alpine lacks it and the
        # runner aborts on CREATE EXTENSION vector. The Postgres image
        # also exposes the pgvector SQL files under /usr/local/share;
        # no extra setup is required — `CREATE EXTENSION IF NOT EXISTS
        # vector` in 001 picks them up.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_citymarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: ci_citymarket
      DATABASE_USER: ci_user
      DATABASE_PASSWORD: ci_password
      JWT_SECRET: ci-test-jwt-secret-min-32-characters-x
      ADMIN_JWT_SECRET: ci-test-admin-jwt-secret-min-32-characters
      VENDOR_JWT_SECRET: ci-test-vendor-jwt-secret-min-32-characters
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Docs link integrity (README → docs/, ios/, DEPLOYMENT.md)
        run: |
          test -f docs/00-FULLSTACK-MASTER-PLAN.md || (echo "::error::missing docs/00-FULLSTACK-MASTER-PLAN.md — sync from origin/main" && exit 1)
          test -f docs/09-IMPLEMENTATION-BACKLOG.md || (echo "::error::missing docs/09-IMPLEMENTATION-BACKLOG.md" && exit 1)
          test -f docs/13-ROLLOUT-CHECKLIST.md || (echo "::error::missing docs/13-ROLLOUT-CHECKLIST.md" && exit 1)

      - name: Migration dry-run (static file validation, no DB write)
        # Cheap pre-flight: parses every .sql, computes checksums, lists
        # pending migrations without writing. Catches SQL parse errors
        # before the more expensive Apply step below.
        run: npm run db:migrate:dry-run

      - name: Apply migrations to CI database (hard-fail)
        # Runs the full migration chain (currently 001 → 074, count
        # verified dynamically by the runner) against a fresh CI
        # Postgres+pgvector. Any DDL failure (missing column, type
        # mismatch, FK rejection, GRANT on a non-existent role, view
        # referencing a missing table) MUST fail this job — the
        # migration runner aborts on the first error and exits non-zero.
        # This is the gate that prevented "schema-only-on-prod"
        # regressions like the 004 addresses guest_key CREATE INDEX,
        # the 007 reviews INTEGER-vs-UUID mismatch, and the 037 vendor
        # cart COALESCE type error. We do NOT pass --mark-applied —
        # every file must apply cleanly from a fresh DB. We do NOT use
        # `|| echo` / `|| true` — migration failures are hard failures.
        run: npm run db:migrate

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Auth isolation audit (static route walk)
        run: npx tsx scripts/auth-isolation-audit.ts

      - name: Worker smoke (boot + schedule check)
        # Catches Dockerfile.worker / scripts/worker.ts regressions that
        # would silently ship a broken container. The test only requires
        # the worker module to load and start — DB query failures inside
        # the scheduled tasks are non-fatal (they're logged and the worker
        # continues). We don't apply migrations here; the migration
        # service container is already provisioned by the Apply step
        # above, so the worker can hit it if needed.
        run: npm run worker:smoke

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; real values injected at runtime via
          # .env.local in production, never committed.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Middleware.ts runtime registration guard
        # Fails loudly if .next/server/middleware-manifest.json ships empty.
        # Root cause of the previous /login + /auth/register smoke failures:
        # the project used `proxy.ts` (Next 16's renamed middleware) but
        # Turbopack 16.2.11 drops proxy.ts from the manifest. Renamed to
        # `src/middleware.ts` (legacy name, still supported in Next 16) —
        # that fixes registration and restores the CSRF/auth gates at
        # runtime. The guard runs WITHOUT --soft now that the regression
        # is fixed, so any future drift fails the build.
        run: npm run proxy:guard

      - name: Start Next.js server (background, for QA gates)
        # Boots the production server on port 4050 for qa:smoke and
        # qa:critical-paths. The runner cleans up background processes
        # after the job, so we don't need to kill it explicitly.
        # NODE_ENV stays unset so next start picks production defaults
        # without activating strict prod-only env assertions (those
        # have already been satisfied by the JWT_SECRET exports above).
        env:
          PORT: "4050"
          HOSTNAME: "127.0.0.1"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: |
          nohup npx next start -p 4050 -H 127.0.0.1 > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4050/api/v1/auth/config || true)
            if [ "$code" = "200" ]; then
              echo "Next.js server up after ${i}s (pid=$(cat /tmp/next.pid))"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server failed to start within 60s"
          tail -50 /tmp/next.log
          exit 1

      - name: QA smoke (HTTP routes + DB shape)
        # After PR #5's migration sweep, this gate exercises the
        # genuinely-migrated schema. /api/v1/products and
        # /api/v1/categories return real data because all 001→074
        # migrations applied cleanly. No "KNOWN GAP" remains.
        env:
          BASE_URL: http://127.0.0.1:4050
        run: npm run qa:smoke

      - name: QA critical paths (revenue + security endpoints)
        # Coupon validation, cart round-trip, CSRF enforcement, delivery
        # quote. After PR #5 the schema includes the City Markets HQ
        # row (migration 074) so delivery/quote returns a numeric fee
        # rather than 503. Cart POST round-trip works because the
        # partial unique index in 037 + the cart route's ON CONFLICT
        # expression are aligned (PR #5 round 2 fix).
        env:
          BASE_URL: http://127.0.0.1:4050
        run: npm run qa:critical-paths

      - name: Golden-path E2E (webhook → vendor lifecycle)
        # Production-completion-2026-09-29 audit closure: full webhook
        # HTTP route coverage for Bug A + Bug F + Gap D regression
        # guards. The script seeds an order + vendor_order, fires the
        # HMAC-signed canonical webhook, and asserts orders.status =
        # 'confirmed' (NEVER 'paid'), vendor_orders.status = 'confirmed',
        # payment_events ledger row exists, then progresses the vendor
        # lifecycle to 'delivered'. Skips gracefully if BASE_URL or
        # MOYASAR_WEBHOOK_SECRET are unavailable.
        env:
          BASE_URL: http://127.0.0.1:4050
        run: npm run qa:golden-path

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14